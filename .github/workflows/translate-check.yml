name: Check Truth Social translation backends

on:
  workflow_dispatch:
  push:  # TEMPORARY: lets the self-check run from the dev branch; remove before merging
    branches: [claude/wonderful-einstein-30k3o2]
    paths: [.github/workflows/translate-check.yml, market_pulse/truth_social.py]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/truth_social.txt
      - name: Translate a sample with every configured backend
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m market_pulse.truth_social --check-translation
