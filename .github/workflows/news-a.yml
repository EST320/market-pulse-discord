name: Wallstreetcn A-Stock to Discord

on:
  workflow_dispatch:

concurrency:
  group: wallstreetcn-a-stock
  # A newer run replaces an older one that is still queued or running.
  # Runs normally finish in seconds, so this only bites when GitHub leaves
  # a run stuck in the queue; waiting behind it instead would cancel every
  # later run (as happened on 2026-10-31, when one stuck run blocked the
  # tracker for ten hours).
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements/base.txt

      - name: Fetch A-stock live news and post
        env:
          DISCORD_WEBHOOK_URL_A: ${{ secrets.DISCORD_WEBHOOK_URL_A }}
        run: python -m market_pulse.wallstreetcn a

      - name: Save state
        run: bash scripts/save_state.sh seen_a.json
