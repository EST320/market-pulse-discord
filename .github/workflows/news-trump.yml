name: Trump Truth Tracker to Discord

on:
  workflow_dispatch:

concurrency:
  group: trump-truth-tracker
  # A newer run replaces an older one that is still queued or running.
  # Runs normally finish in seconds, so this only bites when GitHub leaves
  # a run stuck in the queue; waiting behind it instead would cancel every
  # later run (as happened on 2026-10-31, when one stuck run blocked the
  # tracker for ten hours).
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post-trump-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements/truth_social.txt

      - name: Fetch Trump posts and send to Discord
        env:
          DISCORD_WEBHOOK_URL_TRUMP: ${{ secrets.DISCORD_WEBHOOK_URL_TRUMP }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python -m market_pulse.truth_social

      - name: Save state
        run: bash scripts/save_state.sh seen_trump.json
